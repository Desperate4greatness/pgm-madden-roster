name: Auto Update PGM Roster

on:
  schedule:
    - cron: '0 6 * * 2' # Runs automatically every Tuesday at 6:00 AM UTC
  workflow_dispatch:      # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sync script
        run: python scripts/sync_roster.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add roster.json staff.json
          if git diff --staged --quiet; then
            echo "Both roster and staff are up to date. Nothing to commit."
          else
            git commit -m "Auto-update roster & staff for Pocket GM [skip ci]"
            git push origin main
          fi
