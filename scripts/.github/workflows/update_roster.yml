name: Auto Update PGM Roster

on:
  schedule:
    # Runs every Friday at 06:00 UTC (after EA's Thursday roster release)
    - cron: '0 6 * * 5'
  workflow_dispatch: # Allows manual 1-click trigger anytime

jobs:
  update-roster:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Roster Sync
        run: python scripts/sync_roster.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add roster.json
          if git diff --staged --quiet; then
            echo "No roster changes detected."
          else
            git commit -m "Auto-update roster with latest Madden ratings [skip ci]"
            git push
          fi
